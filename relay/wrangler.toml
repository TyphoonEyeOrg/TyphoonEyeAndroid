# TyphoonEye relay (F-Droid build). See README.md for the deploy steps.
# No secrets in this file: API keys are Worker secrets (`wrangler secret put …`).
name = "typhooneye-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Only reachable on our own subdomain (one level under seamain.org, so Universal SSL
# covers it). No *.workers.dev URL: it is often unreachable from mainland China.
workers_dev = false
preview_urls = false
# No Logpush either (see [observability] below).
logpush = false
routes = [
  { pattern = "te-relay.seamain.org", custom_domain = true }
]

# Refresh the shared typhoon-warning list every 30 minutes
# (keep ALERT_CRON_INTERVAL_MINUTES in src/alerts.ts in sync).
[triggers]
crons = ["*/30 * * * *"]

# No request logs or traces: the relay must not keep IPs or query parameters.
[observability]
enabled = false

# Shared response cache + the warning list written by the cron job.
# Create with `npx wrangler kv namespace create RELAY_KV` and paste the id here.
[[kv_namespaces]]
binding = "RELAY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Rate limits per client (salted hash of the IP), counted per Cloudflare location.
# Loose on purpose: carrier-grade NAT puts many mobile users in China behind one IP.
# To change a limit, edit `limit` below and redeploy (`period` must be 10 or 60 seconds).
#
# All requests: 600 per minute per client IP.
[[ratelimits]]
name = "RL_REQUESTS"
namespace_id = "41001"
  [ratelimits.simple]
  limit = 600
  period = 60

# Requests that would reach a weather provider (edge cache and KV both missed):
# 120 per minute per client IP.
[[ratelimits]]
name = "RL_UPSTREAM"
namespace_id = "41002"
  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
# Cron: only coastal points within this distance of an active storm are queried
# (when storm positions are known; otherwise all points).
ALERT_STORM_RADIUS_KM = "1500"
# Cron: at most this many points per run (rotating). Keeps a run under the
# 50-subrequest limit of the Workers Free plan.
MAX_ALERT_POINTS_PER_RUN = "40"
# Global daily budget of provider calls per source, counted in KV per UTC+8 day (resets at
# 00:00 UTC+8). Over budget the relay serves the last good answer (up to 6 h old) or 503
# {"error":"budget_exhausted"} with Retry-After; the cron job skips its run. Best effort:
# concurrent requests may undercount a little, and a KV failure lets requests through.
# Set to about 80 % of the account's daily quota; "0" blocks all calls to that provider.
JUHE_DAILY_BUDGET = "400"
# QWeather: tropical calls (list/track/forecast) plus the cron's weather-alert calls.
QWEATHER_DAILY_BUDGET = "4000"
