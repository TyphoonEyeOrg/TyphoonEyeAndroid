[versions]
# AGP 9.x + Hilt still hit BaseExtension cast failures. Stay on AGP 8.9 + Hilt 2.56.
agp = "8.9.1"
coreKtx = "1.17.0"
appcompat = "1.7.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
kotlin = "2.1.10"
ksp = "2.1.10-1.0.31"
composeBom = "2025.06.01"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.7.3"
coroutines = "1.9.0"
eddsa = "0.3.0"
maplibre = "11.13.1"
datastore = "1.1.7"
work = "2.10.2"
room = "2.6.1"
navigation = "2.8.4"
turbine = "1.2.0"
hilt = "2.56.2"
androidxHilt = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
