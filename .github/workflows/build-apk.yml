name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master", "foss" ]
    # No tag trigger on foss: foss only gets fdroid-* tags, and the fdroid-*
    # reference Release is created by hand from this branch's CI artifacts.
    # v* tags/Releases belong to master (GitHub edition).
  pull_request:
    branches: [ "main", "master", "foss" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish Release to GitHub Releases page (foss: normally off; fdroid-* Releases are made by hand)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin the exact JDK patch used by the F-Droid buildserver (openjdk 21.0.12)
      # so the fdroid-flavor APK is byte-identical for reproducible builds.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21.0.12'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare local.properties
        run: |
          touch local.properties
          if [ -n "${{ secrets.JUHE_KEY }}" ]; then
            echo "JUHE_KEY=${{ secrets.JUHE_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUHE_API_KEY }}" ]; then
            echo "JUHE_API_KEY=${{ secrets.JUHE_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUHEKEY }}" ]; then
            echo "JUHEKEY=${{ secrets.JUHEKEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_API_KEY }}" ]; then
            echo "QWEATHER_API_KEY=${{ secrets.QWEATHER_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_KID }}" ]; then
            echo "QWEATHER_KID=${{ secrets.QWEATHER_KID }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_PROJECT_ID }}" ]; then
            echo "QWEATHER_PROJECT_ID=${{ secrets.QWEATHER_PROJECT_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_PRIVATE_KEY }}" ]; then
            echo "QWEATHER_PRIVATE_KEY=${{ secrets.QWEATHER_PRIVATE_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> local.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties
          fi

      - name: Extract Tag or Version Info
        id: get_version
        run: |
          # Prefer the pushed GitHub tag (vX.Y.Z). Otherwise use git describe so
          # APK versionName matches the nearest release tag.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="$(git describe --tags --match 'v*' --dirty 2>/dev/null || true)"
            if [[ -z "$TAG_NAME" ]]; then
              SHORT_SHA="$(git rev-parse --short HEAD)"
              TAG_NAME="v0.1.0-${SHORT_SHA}"
            fi
          fi
          # Strip leading v for Android versionName / Gradle VERSION_NAME
          VERSION_NAME="${TAG_NAME#v}"
          # versionCode is never derived from commit count; Gradle reads
          # version.properties (F-Droid low-bit ABI scheme, base*10+1..4).

          echo "VERSION=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: tag=$TAG_NAME name=$VERSION_NAME"

      - name: Unit tests
        run: ./gradlew testFdroidDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testFdroidDebugUnitTest/
          retention-days: 7

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        env:
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          JUHEKEY: ${{ secrets.JUHEKEY }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleFdroidDebug --stacktrace

      # No github-flavor build on foss: GitHub-edition APKs come only from master.

      # fdroid flavor APK is uploaded too so F-Droid's reproducible-build
      # check can compare against the same binary it builds.
      # It MUST build in a clean environment identical to F-Droid:
      #  - no API keys (empty BuildConfig strings)
      #  - no VERSION_NAME/VERSION_CODE (GITHUB_ENV would otherwise leak
      #    git-rev-list as versionCode, which F-Droid does not set)
      #  - keep only sdk.dir + release signing so the APK matches AllowedAPKSigningKeys
      - name: Build Release APK (fdroid flavor)
        if: ${{ inputs.build_type == 'release' || inputs.build_type == '' }}
        env:
          VERSION_NAME: ''
          VERSION_CODE: ''
          JUHE_KEY: ''
          JUHE_API_KEY: ''
          JUHEKEY: ''
          QWEATHER_API_KEY: ''
          QWEATHER_KID: ''
          QWEATHER_PROJECT_ID: ''
          QWEATHER_PRIVATE_KEY: ''
          QWEATHER_HOST: ''
          AMAP_KEY: ''
          MAPLIBRE_STYLE_URL: ''
          MAP_BASEMAP: ''
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            if [ -f release.keystore ]; then
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            fi
          } > local.properties
          ./gradlew --stop || true
          ./gradlew assembleFdroidRelease --stacktrace

      - name: Process & Rename APK Artifacts
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" | while read file; do
            filename=$(basename "$file")
            new_name="TyphoonEye-${{ env.VERSION }}-${filename}"
            cp "$file" "output_apks/$new_name"
          done
          echo "Generated APK files:"
          ls -lh output_apks/

      - name: Generate Changelog Notes
        id: changelog
        run: |
          echo "### 📝 最近更新日志 (Changelog)" > release_notes.md
          echo "" >> release_notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "**自上个版本 ($PREV_TAG) 以来的更新：**" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> release_notes.md
          else
            echo "**最近 Commit 提交变动：**" >> release_notes.md
            git log -n 10 --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TyphoonEye-APK-${{ env.VERSION }}
          path: output_apks/*.apk
          retention-days: 14

      - name: Create & Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: TyphoonEye 台风眼 ${{ steps.get_version.outputs.tag_name }}
          body_path: release_notes.md
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          # Allow re-running on the same tag (e.g. after CI fixes) to update assets.
          update_release_body: true
          update_release_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
