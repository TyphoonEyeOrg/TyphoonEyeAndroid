name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish Release to GitHub Releases page'
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare local.properties
        run: |
          touch local.properties
          if [ -n "${{ secrets.JUHE_KEY }}" ]; then
            echo "JUHE_KEY=${{ secrets.JUHE_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUHE_API_KEY }}" ]; then
            echo "JUHE_API_KEY=${{ secrets.JUHE_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUHEKEY }}" ]; then
            echo "JUHEKEY=${{ secrets.JUHEKEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_API_KEY }}" ]; then
            echo "QWEATHER_API_KEY=${{ secrets.QWEATHER_API_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_KID }}" ]; then
            echo "QWEATHER_KID=${{ secrets.QWEATHER_KID }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_PROJECT_ID }}" ]; then
            echo "QWEATHER_PROJECT_ID=${{ secrets.QWEATHER_PROJECT_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.QWEATHER_PRIVATE_KEY }}" ]; then
            echo "QWEATHER_PRIVATE_KEY=${{ secrets.QWEATHER_PRIVATE_KEY }}" >> local.properties
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> local.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties
          fi

      - name: Extract Tag or Version Info
        id: get_version
        run: |
          # Prefer the pushed GitHub tag (vX.Y.Z). Otherwise use git describe so
          # APK versionName matches the nearest release tag.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="$(git describe --tags --match 'v*' --dirty 2>/dev/null || true)"
            if [[ -z "$TAG_NAME" ]]; then
              SHORT_SHA="$(git rev-parse --short HEAD)"
              TAG_NAME="v0.1.0-${SHORT_SHA}"
            fi
          fi
          # Strip leading v for Android versionName / Gradle VERSION_NAME
          VERSION_NAME="${TAG_NAME#v}"
          # versionCode comes only from version.properties (base*10+abi, see
          # app/build.gradle.kts). Do NOT derive it from commit count: that would
          # jump past F-Droid's codes and break GitHub <-> F-Droid switching.
          PROPS_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '[:space:]')"
          if [[ "${{ github.ref }}" == refs/tags/v* && "$VERSION_NAME" != "$PROPS_NAME" ]]; then
            echo "::error::Tag $TAG_NAME does not match version.properties VERSION_NAME=$PROPS_NAME"
            exit 1
          fi

          echo "VERSION=$TAG_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved version: tag=$TAG_NAME name=$VERSION_NAME (versionCode from version.properties)"

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        env:
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          JUHEKEY: ${{ secrets.JUHEKEY }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == '' }}
        env:
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          JUHEKEY: ${{ secrets.JUHEKEY }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Process & Rename APK Artifacts
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/ -name "*.apk" | while read file; do
            filename=$(basename "$file")
            # app-<abi>-release.apk -> TyphoonEye-vX-app-github-<abi>-release.apk
            # app-universal-release.apk -> TyphoonEye-vX-app-github-release.apk (TYP-5/TYP-36)
            filename="${filename/app-universal-/app-}"
            new_name="TyphoonEye-${{ env.VERSION }}-${filename/app-/app-github-}"
            cp "$file" "output_apks/$new_name"
          done
          echo "Generated APK files:"
          ls -lh output_apks/

      - name: Generate Changelog Notes
        id: changelog
        run: |
          echo "### 📝 最近更新日志 (Changelog)" > release_notes.md
          echo "" >> release_notes.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "**自上个版本 ($PREV_TAG) 以来的更新：**" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> release_notes.md
          else
            echo "**最近 Commit 提交变动：**" >> release_notes.md
            git log -n 10 --pretty=format:"* %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TyphoonEye-APK-${{ env.VERSION }}
          path: output_apks/*.apk
          retention-days: 14

      - name: Create & Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: TyphoonEye 台风眼 ${{ steps.get_version.outputs.tag_name }}
          body_path: release_notes.md
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
